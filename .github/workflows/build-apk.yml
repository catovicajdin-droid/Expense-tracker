name: Build APK

on:
  push:
    branches: [main, paid-version]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo doesn't commit a Gradle wrapper, so pin the version here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle :app:testDebugUnitTest

      - run: gradle :app:assembleDebug

      - run: cp app/build/outputs/apk/debug/app-debug.apk expense-tracker-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug
          path: expense-tracker-debug.apk

      # Each branch's latest build as a phone-friendly download link, replaced on every push:
      # main (the personal app) as latest-debug, paid-version as latest-paid-debug.
      - if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          make_latest: false
          body: Debug build of ${{ github.sha }}. Download the APK below on the phone to install it.
          files: expense-tracker-debug.apk

      - if: github.event_name != 'pull_request' && github.ref_name == 'paid-version'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-paid-debug
          name: Latest paid-version debug build
          prerelease: true
          make_latest: false
          body: Debug build of the paid-version branch at ${{ github.sha }}. Installs next to the personal app as "Expense Tracker (paid)".
          files: expense-tracker-debug.apk
